<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="fbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1F3D" />
      <stop offset="50%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="fbAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="fbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle with subtle border -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#fbBg)" stroke="rgba(255,255,255,0.2)" stroke-width="2.5" />

  <!-- Radar Pulse Rings -->
  <circle cx="64" cy="64" r="42" stroke="rgba(56, 189, 248, 0.25)" stroke-width="2" stroke-dasharray="4 4" />
  <circle cx="64" cy="64" r="28" stroke="rgba(56, 189, 248, 0.45)" stroke-width="2" />

  <!-- Central Recovery Shield & Pin Monogram -->
  <path d="M64 28 C78 28 88 38 88 52 C88 68 64 96 64 96 C64 96 40 68 40 52 C40 38 50 28 64 28 Z" 
        fill="url(#fbAccent)" 
        filter="url(#fbGlow)" 
        opacity="0.95" />

  <!-- Inner Sparkle Node -->
  <circle cx="64" cy="52" r="8" fill="#FFFFFF" />
  <path d="M64 40 L66 48 L74 50 L66 52 L64 60 L62 52 L54 50 L62 48 Z" fill="#38BDF8" />

  <!-- Sweeping Search Ray -->
  <line x1="64" y1="52" x2="88" y2="34" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.85" />
</svg>
